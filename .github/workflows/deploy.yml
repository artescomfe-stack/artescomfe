name: Build e publicação

# A cada push na main, gera o site (dist/) e publica na branch "deploy",
# que é a branch que a Hostinger puxa para public_html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Valores públicos (URL + chave publishable). Ficam em Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Publica dist/ na branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          # Mantém o histórico: a Hostinger faz "git pull" e precisa de avanço linear.
          keep_files: false
          user_name: artescomfe-stack
          user_email: 361752301+artescomfe-stack@users.noreply.github.com
          commit_message: "Build ${{ github.sha }}"
